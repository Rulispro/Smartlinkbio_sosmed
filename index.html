<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Affiliate Products</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f6fa;
  color:#202331;
  font-family:Arial,sans-serif;
}

header{
  background:#fff;
  padding:22px 16px;
  text-align:center;
  border-bottom:1px solid #eee;
}

header h1{
  margin:0;
  font-size:24px;
}

header p{
  color:#777;
  margin:8px 0 0;
  font-size:14px;
}

main{
  max-width:760px;
  margin:22px auto;
  padding:0 14px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
  outline-color:#2563eb;
}

.item{
  background:#fff;
  border:1px solid #eee;
  border-radius:12px;
  padding:16px;
  margin-top:14px;
}

.item h2{
  font-size:18px;
  margin:0 0 12px;
}

.link{
  display:block;
  text-decoration:none;
  background:#2563eb;
  color:#fff;
  padding:12px 14px;
  border-radius:8px;
  margin-top:8px;
  text-align:center;
  font-weight:bold;
}

.link:hover{
  background:#1d4ed8;
}

.muted{
  text-align:center;
  color:#777;
  padding:25px;
}

.error{
  text-align:center;
  color:#dc2626;
  background:#fff;
  border:1px solid #fecaca;
  border-radius:10px;
  padding:15px;
  margin-top:15px;
}
</style>
</head>

<body>

<header>
  <h1>Affiliate Products</h1>
  <p>Temukan produk pilihan kami</p>
</header>

<main>

  <input
    id="search"
    type="search"
    placeholder="🔎 Cari produk..."
  >

  <div id="products">
    <p class="muted">Memuat produk...</p>
  </div>

</main>

<script>

let products = [];

const API_URL = "/api/links";


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value ?? "").replace(
    /[&<>"']/g,

    function(char){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[char];

    }
  );

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  const box =
    document.getElementById("products");

  box.innerHTML =
    '<p class="muted">Memuat produk...</p>';

  try{

    console.log("Mengambil data dari:", API_URL);

    const response =
      await fetch(
        API_URL + "?public=1&t=" + Date.now(),
        {
          method:"GET",
          cache:"no-store",
          headers:{
            "Accept":"application/json"
          }
        }
      );


    console.log(
      "API status:",
      response.status
    );


    if(!response.ok){

      const errorText =
        await response.text();

      throw new Error(
        "API Error " +
        response.status +
        ": " +
        errorText
      );

    }


    const data =
      await response.json();


    console.log(
      "Data API:",
      data
    );


    if(
      !data ||
      !Array.isArray(data.published)
    ){

      throw new Error(
        "Format data API tidak valid."
      );

    }


    products =
      data.published;


    render();


  }catch(error){

    console.error(
      "Gagal memuat produk:",
      error
    );


    box.innerHTML = `
      <div class="error">
        <strong>Gagal memuat produk</strong>
        <br><br>
        ${escapeHTML(error.message)}
        <br><br>
        <button
          onclick="loadProducts()"
          style="
            border:0;
            background:#2563eb;
            color:white;
            padding:10px 16px;
            border-radius:8px;
            cursor:pointer;
          "
        >
          Coba Lagi
        </button>
      </div>
    `;

  }

}


/* =========================
   RENDER
========================= */

function render(){

  const search =
    document.getElementById("search");

  const box =
    document.getElementById("products");

  const q =
    search.value
      .toLowerCase()
      .trim();


  const found =
    products.filter(function(product){

      return String(
        product.title || ""
      )
      .toLowerCase()
      .includes(q);

    });


  if(!found.length){

    box.innerHTML =
      '<p class="muted">Produk tidak ditemukan.</p>';

    return;

  }


  box.innerHTML =
    found.map(function(product){

      const urls =
        Array.isArray(product.urls)
          ? product.urls
          : [];


      return `
        <article class="item">

          <h2>
            ${escapeHTML(product.title)}
          </h2>

          ${
            urls.map(function(url,index){

              return `
                <a
                  class="link"
                  href="${escapeHTML(url)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Lihat Produk ${index + 1} ↗
                </a>
              `;

            }).join("")
          }

        </article>
      `;

    }).join("");

}


/* =========================
   SEARCH
========================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    render
  );


/* =========================
   START
========================= */

loadProducts();

</script>

</body>
</html>
