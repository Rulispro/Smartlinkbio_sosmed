<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Affiliate Products</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f6fa;
  color:#202331;
  font-family:Arial,sans-serif;
}

header{
  background:#fff;
  padding:22px 16px;
  text-align:center;
  border-bottom:1px solid #eee;
}

header h1{
  margin:0;
  font-size:24px;
}

header p{
  color:#777;
  margin:8px 0 0;
  font-size:14px;
}

main{
  max-width:760px;
  margin:22px auto;
  padding:0 14px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
  outline-color:#2563eb;
}

.item{
  background:#fff;
  border:1px solid #eee;
  border-radius:12px;
  padding:16px;
  margin-top:14px;
}

.item h2{
  font-size:18px;
  margin:0 0 12px;
}

.link{
  display:block;
  text-decoration:none;
  background:#2563eb;
  color:#fff;
  padding:12px 14px;
  border-radius:8px;
  margin-top:8px;
  text-align:center;
  font-weight:bold;
}

.link:hover{
  background:#1d4ed8;
}

.muted{
  text-align:center;
  color:#777;
  padding:25px;
}

.error{
  text-align:center;
  color:#dc2626;
  background:#fff;
  border:1px solid #fecaca;
  border-radius:10px;
  padding:15px;
  margin-top:15px;
}

.retry{
  border:0;
  background:#2563eb;
  color:#fff;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

code{
  background:#fee2e2;
  padding:2px 6px;
  border-radius:4px;
  font-family:monospace;
}

</style>
</head>


<body>


<header>

  <h1 id="pageTitle">
    Affiliate Products
  </h1>

  <p>
    Temukan produk pilihan kami
  </p>

</header>


<main>

  <input
    id="search"
    type="search"
    placeholder="🔎 Cari produk..."
    autocomplete="off"
  >


  <div id="products">

    <p class="muted">
      Memuat produk...
    </p>

  </div>

</main>


<script>

/* =========================
   DATA PRODUK
========================= */

let products = [];


/* =========================
   API
========================= */

const API_URL = "/api/links";


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value ?? "").replace(
    /[&<>"']/g,

    function(char){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[char];

    }
  );

}


/* =========================
   LOAD PRODUK (CARA 1: DARI QUERY URL)
========================= */

async function loadProducts(){

  const box =
    document.getElementById("products");


  box.innerHTML =
    '<p class="muted">Memuat produk...</p>';


  // 1. Ambil ID Akun dari URL (?account=nama_akun)
  const urlParams = new URLSearchParams(window.location.search);
  const accountId = urlParams.get('account');


  // 2. Jika tidak ada parameter account di URL
  if (!accountId) {

    box.innerHTML = `

      <div class="error">

        <strong>
          Akun Tidak Ditemukan
        </strong>

        <br>
        <br>

        Link tidak valid atau belum memilih akun. Pastikan URL Anda berisi nama akun.

        <br>
        <br>

        Contoh URL yang benar:
        <br>
        <code>?account=nama_akun</code>

      </div>

    `;

    return;

  }


  try{

    // 3. Panggil API dengan menyertakan parameter account
    const response =
      await fetch(
        API_URL + "?account=" + encodeURIComponent(accountId) + "&t=" + Date.now(),
        {
          method:"GET",
          cache:"no-store",
          headers:{
            "Accept":"application/json"
          }
        }
      );


    if(!response.ok){

      const errorText =
        await response.text();

      throw new Error(
        "API Error " +
        response.status +
        ": " +
        errorText
      );

    }


    const data =
      await response.json();


    if(
      !data ||
      !Array.isArray(data.published)
    ){

      throw new Error(
        "Format data API tidak valid."
      );

    }


    // Jika ada nama akun, ubah judul header secara dinamis
    if (data.name) {
      document.getElementById("pageTitle").textContent = "Affiliate " + data.name;
    }


    products =
      data.published;


    render();


  }catch(error){

    console.error(
      "Gagal memuat produk:",
      error
    );


    box.innerHTML = `

      <div class="error">

        <strong>
          Gagal memuat produk
        </strong>

        <br>
        <br>

        ${escapeHTML(error.message)}

        <br>
        <br>

        <button
          class="retry"
          onclick="loadProducts()"
        >
          Coba Lagi
        </button>

      </div>

    `;

  }

}


/* =========================
   TAMPILKAN PRODUK
========================= */

function render(){

  const search =
    document.getElementById("search");


  const box =
    document.getElementById("products");


  const q =
    search.value
      .toLowerCase()
      .trim();


  const found =
    products.filter(function(product){

      return String(
        product.title || ""
      )
      .toLowerCase()
      .includes(q);

    });


  /* =========================
     TIDAK ADA PRODUK
  ========================= */

  if(!found.length){

    box.innerHTML =
      '<p class="muted">Produk tidak ditemukan.</p>';

    return;

  }


  /* =========================
     RENDER PRODUK
  ========================= */

  box.innerHTML =
    found.map(function(product){

      const urls =
        Array.isArray(product.urls)
          ? product.urls.filter(Boolean)
          : [];


      const firstUrl =
        urls.length > 0
          ? urls[0]
          : "#";


      return `

        <article class="item">

          <h2>
            ${escapeHTML(product.title)}
          </h2>


          ${
            firstUrl !== "#"

              ? `

                <a
                  class="link"
                  href="${escapeHTML(firstUrl)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Lihat Produk ↗
                </a>

              `

              : `

                <p class="muted">
                  Link produk belum tersedia.
                </p>

              `
          }

        </article>

      `;

    }).join("");

}


/* =========================
   SEARCH
========================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    render
  );


/* =========================
   JALANKAN
========================= */

loadProducts();

</script>


</body>
</html>
