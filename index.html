<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Affiliate Products</title><style>

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:#f5f6fa;
  color:#202331;
  font-family:Arial,sans-serif
}

header{
  background:#fff;
  padding:22px 16px;
  text-align:center;
  border-bottom:1px solid #eee
}

header h1{
  margin:0;
  font-size:24px
}

header p{
  color:#777;
  margin:8px 0 0;
  font-size:14px
}

main{
  max-width:760px;
  margin:22px auto;
  padding:0 14px
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
  outline-color:#2563eb
}

.item{
  background:#fff;
  border:1px solid #eee;
  border-radius:12px;
  padding:16px;
  margin-top:14px
}

.item h2{
  font-size:18px;
  margin:0 0 12px
}

.link{
  display:block;
  text-decoration:none;
  background:#2563eb;
  color:white;
  padding:12px 14px;
  border-radius:8px;
  margin-top:8px;
  text-align:center;
  font-weight:bold
}

.link:hover{
  background:#1d4ed8
}

.muted{
  text-align:center;
  color:#777;
  padding:25px
}

</style></head><body><header>  <h1>Affiliate Products</h1>  <p>
    Temukan produk pilihan kami
  </p></header><main><input
id="search"
placeholder="🔎 Cari produk..."
oninput="render()"

«»

  <div id="products">
    <p class="muted">
      Memuat produk...
    </p>
  </div></main><script>

let products=[];


/* Lindungi tampilan dari HTML */

const escapeHTML=s=>
  String(s??"").replace(
    /[&<>"']/g,
    c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );


/* Load produk published */

async function load(){

  try{

    const r=
      await fetch(
        "/api/links",
        {
          cache:"no-store"
        }
      );

    if(!r.ok)
      throw Error("Gagal memuat");

    const d=
      await r.json();

    products=
      Array.isArray(d.published)
      ? d.published
      : [];

    render();

  }catch(e){

    document.getElementById(
      "products"
    ).innerHTML=
      '<p class="muted">Produk belum dapat dimuat. Silakan coba lagi.</p>';

  }

}


/* Render produk */

function render(){

  const q=
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const found=
    products.filter(
      p=>
        (p.title||"")
        .toLowerCase()
        .includes(q)
    );


  const box=
    document.getElementById(
      "products"
    );


  if(!found.length){

    box.innerHTML=
      '<p class="muted">Produk tidak ditemukan.</p>';

    return;

  }


  box.innerHTML=
    found.map(p=>`

      <article class="item">

        <h2>
          ${escapeHTML(p.title)}
        </h2>

        ${
          (
            Array.isArray(p.urls)
            ? p.urls
            : []
          ).map(
            (u,i)=>`

              <a
                class="link"
                href="${escapeHTML(u)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                Lihat Produk ${i+1} ↗
              </a>

            `
          ).join("")
        }

      </article>

    `).join("");

}


load();

</script></body>
</html>
