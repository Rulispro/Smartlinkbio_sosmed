<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel - Multi Akun</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#222;font-family:Arial,sans-serif}
header{background:#111827;color:white;padding:18px;text-align:center}
main{max-width:800px;margin:20px auto;padding:0 14px}
.card{background:white;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #0000000a}
h2{font-size:19px;margin:0 0 14px}
label{display:block;font-weight:bold;margin:13px 0 6px}
input,textarea,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;font-size:15px}
textarea{min-height:100px;resize:vertical}
button{border:0;border-radius:8px;padding:11px 14px;font-weight:bold;cursor:pointer;margin:5px 4px 0 0}
.primary{background:#2563eb;color:white}
.green{background:#16a34a;color:white}
.red{background:#dc2626;color:white}
.gray{background:#e5e7eb;color:#222}
.entry{border:1px solid #e5e7eb;border-radius:9px;padding:13px;margin-top:10px;overflow-wrap:anywhere}
.entry h3{margin:0 0 8px;font-size:16px}
.status{display:none;padding:11px;border-radius:8px;margin-bottom:12px}
.status.show{display:block}
.ok{background:#dcfce7;color:#166534}
.err{background:#fee2e2;color:#991b1b}
.small{font-size:13px;color:#666}
.url-list{margin-top:10px;padding-left:18px}
.url-list li{margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;word-break:break-all}
.account-bar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.profile-link-box{background:#f9fafb;padding:12px;border-radius:8px;margin-top:15px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <h1>Admin Panel Multi-Akun</h1>
</header>
<main>
  <div class="card">
    <h2>Login Admin</h2>
    <div id="status" class="status"></div>
    <label>Password Admin</label>
    <input id="password" type="password" placeholder="Masukkan password admin">
    <button class="primary" id="login">Masuk / Muat Akun</button>
  </div>

  <section id="panel" hidden>
    <div class="card">
      <h2>Switch Profiles (Pilih Akun)</h2>
      <div class="account-bar">
        <select id="accountSelect" style="flex: 1;"></select>
        <button class="primary" id="openAddAccountModal">+ Akun Baru</button>
        <button class="red" id="deleteAccountBtn">Hapus Akun Ini</button>
      </div>

      <div id="newAccountBox" hidden style="margin-top:12px; padding:12px; background:#f9fafb; border-radius:8px; border:1px solid #e5e7eb;">
        <label>Nama Akun / Profil (contoh: @simple_saja)</label>
        <input id="newAccountName" placeholder="Nama akun...">
        <div style="margin-top:8px;">
          <button class="green" id="saveNewAccount">Simpan Akun</button>
          <button class="gray" id="cancelNewAccount">Batal</button>
        </div>
      </div>

      <div class="profile-link-box">
        <div>
          <span class="small" style="display:block; color:#555;">URL Publik Profil Ini:</span>
          <code id="profileUrlText" style="font-size:14px; font-weight:bold; color:#2563eb;">-</code>
        </div>
        <div>
          <button class="green" id="copyProfileUrl">📋 COPY</button>
          <button class="primary" id="openProfileUrl" target="_blank">👁 BUKA</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 id="formHeading">Tambah Link Produk</h2>
      <label>Judul Produk</label>
      <input id="title" placeholder="Contoh: Sepatu Sneakers Pria">
      <label>URL Affiliate (pisahkan koma jika lebih dari satu)</label>
      <textarea id="links" placeholder="https://contoh.com/sepatu"></textarea>
      <button class="primary" id="save">Simpan Draft</button>
      <button class="gray" id="cancel">Batal Edit</button>
      <button class="red" id="clear">Hapus Input</button>
    </div>

    <div class="card">
      <h2>Draft</h2>
      <button class="green" id="publish">Publish Semua Draft</button>
      <div id="drafts"></div>
    </div>

    <div class="card">
      <h2>Sudah Dipublikasikan</h2>
      <div id="published"></div>
    </div>
  </section>
</main>

<script>
let accounts = [];
let currentAccount = null;
let drafts = [];
let published = [];
let editingId = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

function message(s, ok=false) {
  $("status").textContent = s;
  $("status").className = "status show " + (ok ? "ok" : "err");
}

function password() {
  return $("password").value.trim();
}

async function api(action, extra = {}) {
  // Ambil accountId saat ini jika panel sudah terbuka
  const accountSelectEl = $("accountSelect");
  const accountId = (accountSelectEl && accountSelectEl.value) ? accountSelectEl.value : "";
  
  const r = await fetch("/api/links", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action, password: password(), accountId, ...extra })
  });
  const d = await r.json();
  if (!r.ok) throw Error(d.error || "Permintaan gagal");
  return d;
}

async function load() {
  if (!password()) return message("Masukkan password admin.");
  try {
    const r = await fetch("/api/links?admin=1", {
      headers: { "x-admin-password": password() },
      cache: "no-store"
    });
    const d = await r.json();
    if (!r.ok) throw Error(d.error || "Login gagal");

    accounts = d.accounts || [];
    
    if (accounts.length > 0) {
        $("panel").hidden = false;
        renderAccounts();
        message("Berhasil masuk.", true);
    } else {
        // Kasus jika file JSON kosong/baru
        $("panel").hidden = false;
        message("Berhasil masuk. Silahkan tambah akun baru.", true);
        $("drafts").innerHTML = '';
        $("published").innerHTML = '';
        $("accountSelect").innerHTML = '';
        $("profileUrlText").textContent = '-';
    }
  } catch(e) {
    $("panel").hidden = true;
    message(e.message);
  }
}

function renderAccounts() {
  const select = $("accountSelect");
  // Pertahankan seleksi jika memungkinkan
  const previouslySelected = select.value;
  
  select.innerHTML = accounts.map(acc => `
    <option value="${acc.id}">${esc(acc.name)}</option>
  `).join("");

  // Setel kembali ke yang sebelumnya atau yang pertama
  if (previouslySelected && accounts.some(a => a.id === previouslySelected)) {
      select.value = previouslySelected;
  } else if (accounts.length > 0) {
      select.value = accounts[0].id;
  }

  changeActiveAccount();
}

function changeActiveAccount() {
  const select = $("accountSelect");
  if (!select || !select.value) {
      currentAccount = null;
      return;
  }
  
  const selectedId = select.value;
  currentAccount = accounts.find(a => a.id === selectedId);
  
  if (currentAccount) {
    drafts = currentAccount.drafts || [];
    published = currentAccount.published || [];
    
    // Update kotak URL publik profil
    // Menggunakan format path: domain.com/id_akun
    const cleanUrl = window.location.origin + "/" + currentAccount.id;
    $("profileUrlText").textContent = cleanUrl;
    
    render();
  }
}

$("accountSelect").onchange = changeActiveAccount;

$("copyProfileUrl").onclick = () => {
  const url = $("profileUrlText").textContent;
  if(url === '-') return;
  navigator.clipboard.writeText(url).then(() => alert("URL profil berhasil disalin!"));
};

$("openProfileUrl").onclick = () => {
  const url = $("profileUrlText").textContent;
  if(url === '-') return;
  window.open(url, "_blank");
};

function render() {
  $("drafts").innerHTML = drafts.length ? drafts.map(p => `
    <div class="entry">
      <h3>${esc(p.title)}</h3>
      <ul class="url-list">
        ${(p.urls||[]).map(u => `
          <li>
            <span>${esc(u)}</span>
            <button class="gray" onclick="navigator.clipboard.writeText('${u}').then(()=>alert('Link disalin!'))">Copy</button>
          </li>
        `).join("")}
      </ul>
      <div class="actions">
        <button class="primary" data-edit="${esc(p.id)}">Edit</button>
        <button class="red" data-delete-draft="${esc(p.id)}">Hapus</button>
      </div>
    </div>
  `).join("") : '<p class="small">Belum ada draft.</p>';

  $("published").innerHTML = published.length ? published.map(p => `
    <div class="entry">
      <h3>${esc(p.title)}</h3>
      <ul class="url-list">
        ${(p.urls||[]).map(u => `
          <li>
            <span>${esc(u)}</span>
            <button class="gray" onclick="navigator.clipboard.writeText('${u}').then(()=>alert('Link disalin!'))">Copy</button>
          </li>
        `).join("")}
      </ul>
      <div class="actions">
        <button class="red" data-delete-published="${esc(p.id)}">Hapus</button>
      </div>
    </div>
  `).join("") : '<p class="small">Belum ada produk dipublikasikan.</p>';
}

$("login").onclick = load;

$("openAddAccountModal").onclick = () => { $("newAccountBox").hidden = false; };
$("cancelNewAccount").onclick = () => { $("newAccountBox").hidden = true; $("newAccountName").value = ""; };
$("saveNewAccount").onclick = async () => {
  const name = $("newAccountName").value.trim();
  if (!name) return alert("Nama akun tidak boleh kosong");
  try {
    await api("addAccount", { name });
    $("newAccountName").value = "";
    $("newAccountBox").hidden = true;
    // Load ulang untuk mendapatkan data akun baru beserta ID yang di-generate backend
    await load(); 
    // Set select ke akun yang baru dibuat (asumsi akun baru ada di akhir array)
    if(accounts.length > 0) {
        $("accountSelect").value = accounts[accounts.length - 1].id;
        changeActiveAccount();
    }
  } catch (e) {
    alert(e.message);
  }
};

$("deleteAccountBtn").onclick = async () => {
  const select = $("accountSelect");
  if (!select.value) return;
  
  const accountId = select.value;
  const accountName = select.options[select.selectedIndex].text;
  
  if (!confirm(`Yakin ingin menghapus akun "${accountName}" beserta seluruh link di dalamnya?`)) {
    return;
  }

  try {
    await api("deleteAccount", { accountId });
    alert("Akun berhasil dihapus.");
    await load();
  } catch (e) {
    alert(e.message);
  }
};

$("save").onclick = async () => {
  if(!currentAccount) return alert("Pilih atau tambah akun terlebih dahulu.");
  const title = $("title").value.trim();
  const urls = $("links").value.split(",").map(x => x.trim()).filter(Boolean);
  if (!title || !urls.length) return message("Judul dan minimal 1 URL wajib diisi.");

  try {
    await api("saveDraft", {
      item: { id: editingId || crypto.randomUUID(), title, urls }
    });
    editingId = null;
    $("title").value = "";
    $("links").value = "";
    $("formHeading").textContent = "Tambah Link Produk";
    $("cancel").style.display = "none";
    await load();
    message("Draft disimpan.", true);
  } catch(e) { message(e.message); }
};

$("cancel").onclick = () => {
    editingId = null;
    $("title").value = "";
    $("links").value = "";
    $("formHeading").textContent = "Tambah Link Produk";
    $("cancel").style.display = "none";
};
// Inisialisasi tombol batal sembunyi
$("cancel").style.display = "none";

$("clear").onclick = () => {
    $("title").value = "";
    $("links").value = "";
};

$("drafts").onclick = e => {
  const edit = e.target.dataset.edit;
  const del = e.target.dataset.deleteDraft;
  if (edit) {
    const p = drafts.find(x => x.id === edit);
    if (!p) return;
    editingId = p.id;
    $("title").value = p.title;
    $("links").value = p.urls.join(", ");
    $("formHeading").textContent = "Edit Produk";
    $("cancel").style.display = "inline-block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  if (del && confirm("Hapus draft ini?")) {
    api("deleteDraft", { id: del }).then(load);
  }
};

$("published").onclick = e => {
  const id = e.target.dataset.deletePublished;
  if (id && confirm("Hapus produk ini?")) {
    api("deletePublished", { id }).then(load);
  }
};

$("publish").onclick = () => {
  if(!currentAccount || drafts.length === 0) return alert("Tidak ada draft untuk dipublikasikan.");
  if (confirm("Publikasikan semua draft?")) {
    api("publishAll").then(load);
  }
};
</script>
</body>
</html>
